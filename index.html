<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Synopsis Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--text:#1a1c1f;--muted:#6b7280;--border:#dfe2e6;
  --accent:#2952e3;--accent-text:#ffffff;--danger:#d33;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#15171a;--card:#1e2126;--text:#eceef1;--muted:#9aa1ac;--border:#31353c;--accent:#5b7cfa;--accent-text:#0d1117;}
}
:root[data-theme="dark"]{--bg:#15171a;--card:#1e2126;--text:#eceef1;--muted:#9aa1ac;--border:#31353c;--accent:#5b7cfa;--accent-text:#0d1117;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 60px;}
h1{font-size:1.35rem;margin:0 0 4px;}
p.lead{color:var(--muted);margin:0 0 24px;font-size:.92rem;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;}
.card h2{font-size:.95rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin:0 0 14px;}
label{display:block;font-size:.85rem;margin:10px 0 4px;font-weight:600;}
input[type=text],input[type=number],textarea{
  width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.95rem;font-family:inherit;
}
textarea{min-height:120px;resize:vertical;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.row>div{flex:1;min-width:180px;}
.student-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;}
.student-row div{flex:1;}
.student-row button{flex:0 0 auto;}
button{cursor:pointer;border:none;border-radius:8px;padding:9px 14px;font-size:.9rem;font-weight:600;}
.btn-add{background:transparent;border:1px dashed var(--border);color:var(--accent);width:100%;margin-top:4px;}
.btn-remove{background:transparent;color:var(--danger);border:1px solid var(--border);padding:9px 10px;}
.btn-generate{background:var(--accent);color:var(--accent-text);width:100%;padding:14px;font-size:1rem;margin-top:6px;}
.btn-generate:disabled{opacity:.6;cursor:default;}
.type-option{display:flex;align-items:center;gap:6px;font-weight:600;margin:0;font-size:.9rem;}
.type-option input{width:auto;}
.file-drop{border:1px dashed var(--border);border-radius:8px;padding:14px;text-align:center;font-size:.85rem;color:var(--muted);}
#imgPreview,#logoPreview{max-width:100%;max-height:160px;display:none;margin-top:10px;border-radius:6px;}
#status{font-size:.85rem;margin-top:10px;min-height:1.2em;color:var(--muted);}
#status.err{color:var(--danger);}
#status.ok{color:#1a9c4a;}
.overflow-x{overflow-x:auto;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Project Synopsis Generator</h1>
  <p class="lead">Fill in the details below and download a formatted .docx — no Word needed.</p>

  <div class="card">
    <h2>Document Type</h2>
    <div class="row" style="gap:20px;">
      <label class="type-option"><input type="radio" name="docType" value="Synopsis" checked> Synopsis</label>
      <label class="type-option"><input type="radio" name="docType" value="Project"> Project</label>
    </div>
  </div>

  <div class="card">
    <h2>Institution</h2>
    <div class="row">
      <div><label>College Name</label><input id="college" type="text" value="GOVERNMENT POLYTECHNIC COLLEGE"></div>
      <div><label>Address</label><input id="address" type="text" value="NAGERCOIL - 629004"></div>
    </div>
    <div class="row">
      <div><label>Department</label><input id="dept" type="text" value="DEPARTMENT OF ELECTRICAL AND ELECTRONICS ENGINEERING"></div>
      <div><label>Academic Year</label><input id="year" type="text" value="2026 - 2027"></div>
    </div>
    <label>College Logo (optional)</label>
    <div class="file-drop">
      <input type="file" id="logoImg" accept="image/png,image/jpeg">
      <img id="logoPreview">
    </div>
  </div>

  <div class="card">
    <h2>Project</h2>
    <label>Project Title</label>
    <textarea id="title" style="min-height:60px" placeholder="DESIGN AND IMPLEMENTATION OF ...">DESIGN AND IMPLEMENTATION OF A SYNCHRONOUS BOOST CONVERTER FOR USB-C POWER DELIVERY FAST CHARGING APPLICATIONS</textarea>
    <label>Guide Name</label>
    <input id="guide" type="text" placeholder="e.g. R. Kumar, B.E.," value="Mrs. S. Meena, B.E.,">
  </div>

  <div class="card">
    <h2>Students</h2>
    <div id="students"></div>
    <button type="button" class="btn-add" id="addStudent">+ Add student</button>
  </div>

  <div class="card">
    <h2>Abstract</h2>
    <textarea id="abstract" placeholder="Write the project abstract...">The rapid growth of portable electronic devices such as smartphones, tablets, laptops, and power banks has created a strong demand for fast, efficient, and compact charging solutions. This project proposes the design and implementation of a synchronous boost converter that supports USB-C Power Delivery (PD) fast charging. The converter steps up a low input voltage to the higher voltage levels required by USB-C PD, while synchronous rectification improves efficiency and reduces heat dissipation compared to conventional diode-based designs. The system is simulated and tested for various load conditions to validate its performance in terms of efficiency, ripple, and thermal behavior.</textarea>
  </div>

  <div class="card">
    <h2>Block Diagram</h2>
    <div class="file-drop">
      <input type="file" id="blockImg" accept="image/png,image/jpeg">
      <img id="imgPreview">
    </div>
  </div>

  <div class="card">
    <h2>Estimated Amount</h2>
    <input id="amount" type="text" placeholder="e.g. Rs. 4,500/-" value="Rs. 4,500/-">
  </div>

  <button class="btn-generate" id="genBtn">Download DOCX</button>
  <div id="status"></div>
</div>

<script>
let students=[{name:'A. Arun Kumar',reg:'71812345001'},{name:'B. Divya',reg:'71812345002'}];
const studEl=document.getElementById('students');
function renderStudents(){
  studEl.innerHTML='';
  students.forEach((s,i)=>{
    const row=document.createElement('div');row.className='student-row';
    row.innerHTML=`<div><label>Name</label><input type="text" data-i="${i}" data-f="name" value="${s.name.replace(/"/g,'&quot;')}"></div>
    <div><label>Register No.</label><input type="text" data-i="${i}" data-f="reg" value="${s.reg.replace(/"/g,'&quot;')}"></div>
    ${students.length>1?'<button type="button" class="btn-remove" data-rm="'+i+'">✕</button>':''}`;
    studEl.appendChild(row);
  });
  studEl.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',e=>{
    students[+e.target.dataset.i][e.target.dataset.f]=e.target.value;
  }));
  studEl.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',e=>{
    students.splice(+e.target.dataset.rm,1);renderStudents();
  }));
}
renderStudents();
document.getElementById('addStudent').addEventListener('click',()=>{students.push({name:'',reg:''});renderStudents();});

const fileInput=document.getElementById('blockImg');
const preview=document.getElementById('imgPreview');
let imgData=null;
fileInput.addEventListener('change',()=>{
  const f=fileInput.files[0];
  if(!f){imgData=null;preview.style.display='none';return;}
  const reader=new FileReader();
  reader.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      imgData={buf:reader.result,w:im.naturalWidth,h:im.naturalHeight,ext:f.type==='image/png'?'png':'jpeg'};
      preview.src=URL.createObjectURL(f);preview.style.display='block';
    };
    im.src=reader.result;
  };
  reader.readAsDataURL(f);
});

function loadDefaultLogo(){
  const im=new Image();
  im.onload=()=>{
    logoData={buf:DEFAULT_LOGO_URI,w:im.naturalWidth,h:im.naturalHeight,ext:'jpeg'};
    logoPreview.src=DEFAULT_LOGO_URI;logoPreview.style.display='block';
  };
  im.src=DEFAULT_LOGO_URI;
}
loadDefaultLogo();
logoInput.addEventListener('change',()=>{
  const f=logoInput.files[0];
  if(!f){logoData=null;logoPreview.style.display='none';return;}
  const reader=new FileReader();
  reader.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      logoData={buf:reader.result,w:im.naturalWidth,h:im.naturalHeight,ext:f.type==='image/png'?'png':'jpeg'};
      logoPreview.src=URL.createObjectURL(f);logoPreview.style.display='block';
    };
    im.src=reader.result;
  };
  reader.readAsDataURL(f);
});

function getTypeLabel(){return document.querySelector('input[name="docType"]:checked').value;}
function getFormData(){
  return {
    typeLabel:getTypeLabel(),
    college:document.getElementById('college').value.trim(),
    address:document.getElementById('address').value.trim(),
    dept:document.getElementById('dept').value.trim(),
    year:document.getElementById('year').value.trim(),
    title:document.getElementById('title').value.trim(),
    guide:document.getElementById('guide').value.trim(),
    abstract:document.getElementById('abstract').value.trim(),
    amount:document.getElementById('amount').value.trim()
  };
}
function validateForm(d){
  const missing=[];
  const req={college:'College Name',address:'Address',dept:'Department',year:'Academic Year',title:'Project Title',guide:'Guide Name',abstract:'Abstract',amount:'Estimated Amount'};
  Object.keys(req).forEach(k=>{if(!d[k]) missing.push(req[k]);});
  students.forEach((s,i)=>{
    if(!s.name.trim()) missing.push(`Student ${i+1} Name`);
    if(!s.reg.trim()) missing.push(`Student ${i+1} Register No.`);
  });
  return missing;
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function para(text,{bold=false,italic=false,size=24,align=null,spaceAfter=0,lineSpacing=null,leadTab=false}={}){
  const rPr=`<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman"/>${bold?'<w:b/>':''}${italic?'<w:i/>':''}<w:sz w:val="${size}"/><w:szCs w:val="${size}"/>`;
  const spacingAttr=lineSpacing?`<w:spacing w:after="${spaceAfter}" w:line="${Math.round(lineSpacing*240)}" w:lineRule="auto"/>`:(spaceAfter?`<w:spacing w:after="${spaceAfter}"/>`:'');
  const pPr=`<w:pPr>${align?`<w:jc w:val="${align}"/>`:''}${spacingAttr}<w:rPr>${rPr}</w:rPr></w:pPr>`;
  const lines=String(text).split('\n');
  return lines.map((l,idx)=>{
    const tabRun=(leadTab&&idx===0)?`<w:r><w:rPr>${rPr}</w:rPr><w:tab/></w:r>`:'';
    return `<w:p>${pPr}${tabRun}<w:r><w:rPr>${rPr}</w:rPr><w:t xml:space="preserve">${esc(l)}</w:t></w:r></w:p>`;
  }).join('');
}
function emptyP(){return '<w:p/>';}
function pageBreak(){return '<w:p><w:r><w:br w:type="page"/></w:r></w:p>';}
function tabLine(left,right,{bold=true,size=24,rightPos=8839}={}){
  const rPr=`<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman"/>${bold?'<w:b/>':''}<w:sz w:val="${size}"/><w:szCs w:val="${size}"/>`;
  return `<w:p><w:pPr><w:tabs><w:tab w:val="right" w:pos="${rightPos}"/></w:tabs><w:rPr>${rPr}</w:rPr></w:pPr><w:r><w:rPr>${rPr}</w:rPr><w:t xml:space="preserve">${esc(left)}</w:t></w:r><w:r><w:rPr>${rPr}</w:rPr><w:tab/></w:r><w:r><w:rPr>${rPr}</w:rPr><w:t xml:space="preserve">${esc(right)}</w:t></w:r></w:p>`;
}
function studentsTable(list){
  const rows=list.filter(s=>s.name||s.reg);
  if(!rows.length) return '';
  const cellPara=(text)=>`<w:p><w:pPr><w:jc w:val="left"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman"/><w:b/><w:sz w:val="24"/><w:szCs w:val="24"/></w:rPr><w:t xml:space="preserve">${esc(text)}</w:t></w:r></w:p>`;
  const tr=rows.map(s=>`<w:tr>
    <w:tc><w:tcPr><w:tcW w:w="3600" w:type="dxa"/><w:tcBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/></w:tcBorders></w:tcPr>${cellPara(s.name)}</w:tc>
    <w:tc><w:tcPr><w:tcW w:w="2600" w:type="dxa"/><w:tcBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/></w:tcBorders></w:tcPr>${cellPara(s.reg)}</w:tc>
  </w:tr>`).join('');
  return `<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:jc w:val="center"/><w:tblBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/><w:insideH w:val="nil"/><w:insideV w:val="nil"/></w:tblBorders></w:tblPr><w:tblGrid><w:gridCol w:w="3600"/><w:gridCol w:w="2600"/></w:tblGrid>${tr}</w:tbl>`;
}

async function buildDocx(){
  const d=getFormData();
  const college=d.college||'COLLEGE NAME';
  const address=d.address;
  const dept=d.dept;
  const year=d.year;
  const title=d.title||'PROJECT TITLE';
  const guide=d.guide||'[Guide Name]';
  const abstract=d.abstract||'';
  const amount=d.amount||'';
  const typeLabel=d.typeLabel;

  const zip=new JSZip();
  let rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`;
  const ctypeSet=new Set();
  let relCount=0;
  function embedImage(data,name,maxW,maxH,align){
    relCount++;
    const relId=`rId${relCount}`;
    let w=data.w*9525,h=data.h*9525;
    if(w>maxW){h=h*(maxW/w);w=maxW;}
    if(h>maxH){w=w*(maxH/h);h=maxH;}
    w=Math.round(w);h=Math.round(h);
    rels+=`<Relationship Id="${relId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image${relCount}.${data.ext}"/>`;
    ctypeSet.add(data.ext);
    zip.file(`word/media/image${relCount}.${data.ext}`,data.buf.split(',')[1],{base64:true});
    return `<w:p><w:pPr><w:jc w:val="${align}"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><wp:extent cx="${w}" cy="${h}"/><wp:docPr id="${relCount}" name="${name}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${relCount}" name="${name}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${relId}" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${w}" cy="${h}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
  }

  // PAGE 1: front page
  let body='';
  body+=para(college,{bold:true,size:28,align:'center'});
  body+=para(address,{bold:true,size:26,align:'center'});
  body+=para(dept,{bold:true,size:26,align:'center'});
  body+=para(year,{bold:true,size:26,align:'center'});
  if(logoData) body+=embedImage(logoData,'Logo',1143000,1143000,'center');
  body+=emptyP();
  body+=para(typeLabel,{size:24,align:'center'});
  body+=para('On',{size:24,align:'center'});
  body+=para(title.toUpperCase(),{bold:true,size:26,align:'center'});
  body+=para('Submitted by',{italic:true,size:24,align:'center'});
  body+=studentsTable(students);
  body+=para('Guided by',{size:24,align:'center'});
  body+=para(guide,{bold:true,size:24,align:'center'});
  body+=para('LECTURER',{size:24,align:'center'});
  body+=para(dept,{size:24,align:'center'});
  body+=emptyP();
  body+=tabLine('GUIDE SIGNATURE','HEAD OF THE DEPARTMENT');

  // PAGE 2: synopsis / abstract
  body+=pageBreak();
  body+=para(typeLabel,{bold:true,size:28});
  body+=para(abstract,{size:24,align:'both',lineSpacing:1.5,leadTab:true});

  // PAGE 3: block diagram
  body+=pageBreak();
  body+=para('BLOCK DIAGRAM',{bold:true,size:28});
  if(imgData){
    body+=embedImage(imgData,'BlockDiagram',5029200,3657600,'center');
  } else {
    body+=para('(No block diagram uploaded)',{italic:true,size:24,align:'center'});
  }
  const ctypesImg=[...ctypeSet].map(ext=>`<Default Extension="${ext}" ContentType="image/${ext==='jpeg'?'jpeg':'png'}"/>`).join('');
  rels+='</Relationships>';

  if(amount){
    body+=emptyP();
    body+=para(`ESTIMATED AMOUNT : ${amount}`,{bold:true,size:28});
  }

  const documentXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:body>${body}
<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1080" w:right="1417" w:bottom="1417" w:left="1984" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr>
</w:body></w:document>`;

  const contentTypes=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
${ctypesImg}
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`;

  const dotRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  zip.file('[Content_Types].xml',contentTypes);
  zip.file('_rels/.rels',dotRels);
  zip.file('word/document.xml',documentXml);
  zip.file('word/_rels/document.xml.rels',rels);

  return await zip.generateAsync({type:'blob'});
}

const statusEl=document.getElementById('status');

async function downloadFile(builder,ext){
  const d=getFormData();
  const missing=validateForm(d);
  if(missing.length){
    statusEl.textContent='Please fill in: '+missing.join(', ');
    statusEl.className='err';return;
  }
  statusEl.className='';statusEl.textContent='Building document...';
  const gb=document.getElementById('genBtn');
  gb.disabled=true;
  try{
    const blob=await builder();
    const fname=`${d.typeLabel}_${(d.title.slice(0,50).replace(/[^a-z0-9]+/gi,'_'))}.${ext}`;
    const downloads=(window.claude && window.claude.use)?await window.claude.use('downloads'):null;
    if(downloads){
      await downloads.save({filename:fname,data:blob});
      statusEl.textContent='Saved.';statusEl.className='ok';
    } else {
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
      statusEl.textContent='Downloaded.';statusEl.className='ok';
    }
  }catch(e){
    statusEl.textContent='Error: '+e.message;statusEl.className='err';
  }
  gb.disabled=false;
}
document.getElementById('genBtn').addEventListener('click',()=>downloadFile(buildDocx,'docx'));


</script>
</body>
